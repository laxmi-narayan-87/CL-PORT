<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1660" role="img" aria-labelledby="title desc">
<title id="title">DarkSense AI implementation flowchart</title><desc id="desc">Flowchart of website collection, text preparation, BERT classification, separate visual and heuristic workstreams, and exploratory integration review.</desc>
