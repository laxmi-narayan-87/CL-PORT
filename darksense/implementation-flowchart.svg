</style></defs><rect width="1200" height="1660" fill="#f7f8f3"/><text x="600" y="40" text-anchor="middle" class="h">DarkSense AI — Implementation Logic</text><text x="600" y="66" text-anchor="middle" class="s">Documented workflow overview · integration is exploratory</text>
