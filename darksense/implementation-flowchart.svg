<rect x="360" y="164" width="480" height="50" rx="9" class="d b"/><text x="600" y="195" text-anchor="middle" class="n">Select e-commerce website URLs</text><path class="e" d="M600 214V240"/>
<rect x="360" y="240" width="480" height="50" rx="9" class="d b"/><text x="600" y="271" text-anchor="middle" class="n">Collect website data using Python</text><path class="e" d="M600 290V320"/>
<path d="M600 320L720 370L600 420L480 370Z" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="600" y="365" text-anchor="middle" class="n">Choose collection</text><text x="600" y="386" text-anchor="middle" class="n">approach</text>
