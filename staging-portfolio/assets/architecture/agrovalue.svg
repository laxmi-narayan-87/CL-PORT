<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="agrovalue-title agrovalue-desc"><title id="agrovalue-title">AgroValue forecasting architecture</title><desc id="agrovalue-desc">High-level data path from public mandi data through validation and feature engineering to baseline comparison, chronological evaluation, and a Streamlit dashboard.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#657054"/></marker></defs><rect width="1000" height="280" rx="12" fill="#f8f6f0"/><g><rect x="18" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="103" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">AGMARKNET / OGD</text><text x="103" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Historical mandi data</text><text x="103" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">daily records</text></g><g><path d="M188,135 L217,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="222" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="307" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Collect + validate</text><text x="307" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Required fields</text><text x="307" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">dates and prices</text></g><g><path d="M392,135 L421,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="426" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="511" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Time-series features</text><text x="511" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Commodity / market</text><text x="511" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">chronological data</text></g><g><path d="M596,135 L625,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="630" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="715" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Forecast baselines</text><text x="715" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Seasonal Naive</text><text x="715" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">SARIMAX</text></g><g><path d="M800,135 L829,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="834" y="78" width="148" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="908" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Evaluate + present</text><text x="908" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Holdout: MAE /</text><text x="908" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">RMSE / sMAPE</text><text x="908" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Streamlit dashboard</text></g></svg>