<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="qlearning-title qlearning-desc"><title id="qlearning-title">Q-learning training and evaluation flow</title><desc id="qlearning-desc">Workflow of environment observations, epsilon-greedy action choice, temporal-difference Q-table updates, greedy policy extraction, and evaluation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#657054"/></marker></defs><rect width="1000" height="280" rx="12" fill="#f8f6f0"/><g><rect x="18" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="103" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">FrozenLake</text><text x="103" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">State + reward</text><text x="103" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">next state</text></g><g><path d="M188,135 L217,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="202.5" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">observation</text></g><g><rect x="222" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="307" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Action selection</text><text x="307" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Greedy choice or</text><text x="307" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">epsilon exploration</text></g><g><path d="M392,135 L421,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="406.5" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">action</text></g><g><rect x="426" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="511" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Environment step</text><text x="511" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Reward + next</text><text x="511" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">state / termination</text></g><g><path d="M596,135 L625,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="610.5" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">transition</text></g><g><rect x="630" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="715" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">TD / Q-table</text><text x="715" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">TD target and error</text><text x="715" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">update Q(s,a)</text></g><g><path d="M800,135 L829,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="814.5" y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">trained values</text></g><g><rect x="834" y="78" width="148" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="908" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Policy + evaluation</text><text x="908" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Greedy policy</text><text x="908" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">episode success rate</text></g><g><path d="M510,78 L305,52" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="407.5" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">training loop</text></g></svg>