<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="skillforge-title skillforge-desc"><title id="skillforge-title">SkillForge Academy architecture</title><desc id="skillforge-desc">Conceptual flow from learner input through Gemini roadmap generation, Zod structural validation and React Flow display, with Supabase handling authentication and saved progress.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#657054"/></marker></defs><rect width="1000" height="350" rx="12" fill="#f8f6f0"/><g><rect x="30" y="75" width="205" height="105" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="132.5" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Learner / React client</text><text x="132.5" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">React + TypeScript</text><text x="132.5" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Goal and preferences</text></g><g><path d="M235,128 L280,128" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="257.5" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">request</text></g><g><rect x="285" y="75" width="190" height="105" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="380" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Gemini API</text><text x="380" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">AI-assisted roadmap</text><text x="380" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">generation</text></g><g><path d="M475,128 L520,128" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="497.5" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">structured output</text></g><g><rect x="525" y="75" width="190" height="105" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="620" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Zod validation</text><text x="620" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Validate shape before</text><text x="620" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">the UI consumes it</text></g><g><path d="M715,128 L760,128" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="737.5" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">validated roadmap</text></g><g><rect x="765" y="75" width="205" height="105" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="867.5" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">React Flow</text><text x="867.5" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Interactive pathway</text><text x="867.5" y="144" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">and topic navigation</text></g><g><rect x="340" y="235" width="320" height="78" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="500" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Supabase</text><text x="500" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Authentication + user-scoped progress</text></g><g><path d="M130,180 L340,263" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="235" y="213.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">auth / save / load</text></g><g><path d="M340,285 L130,205" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="235" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#657054">saved progress</text></g></svg>