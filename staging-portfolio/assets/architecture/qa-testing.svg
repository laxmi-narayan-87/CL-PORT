<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="qatesting-title qatesting-desc"><title id="qatesting-title">QA test design and evidence workflow</title><desc id="qatesting-desc">Workflow: derive cases from features, plan boundaries and device coverage, record execution evidence, then triage candidate versus confirmed defects.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#657054"/></marker></defs><rect width="1000" height="280" rx="12" fill="#f8f6f0"/><g><rect x="18" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="103" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Product behaviour</text><text x="103" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Requirements and</text><text x="103" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">user journeys</text></g><g><path d="M188,135 L217,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="222" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="307" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Test catalogue</text><text x="307" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Positive / negative</text><text x="307" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">boundary cases</text></g><g><path d="M392,135 L421,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="426" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="511" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Coverage matrix</text><text x="511" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Responsive + browser</text><text x="511" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">regression coverage</text></g><g><path d="M596,135 L625,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="630" y="78" width="170" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="715" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Execution record</text><text x="715" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Expected vs actual</text><text x="715" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">steps + environment</text></g><g><path d="M800,135 L829,135" stroke="#657054" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><g><rect x="834" y="78" width="148" height="115" rx="12" fill="#fffdf8" stroke="#9aa18d" stroke-width="1.5"/><text x="908" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292d26">Defect triage</text><text x="908" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">Candidate vs</text><text x="908" y="147" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#484b43">confirmed bugs</text></g></svg>