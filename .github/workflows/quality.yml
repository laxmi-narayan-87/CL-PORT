name: Static site quality checks

on:
  push:
    branches: [main, ui-ux-refresh, portfolio]
  pull_request:
    branches: [main, portfolio]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Validate public root site and deployment isolation
        run: python .github/scripts/check_site.py
      - name: Validate staging SEO and response-header safeguards
        run: python staging-portfolio/.github/scripts/check_site.py
      - name: Check certification matcher JavaScript syntax
        run: node --check staging-portfolio/assets/certifications.js
