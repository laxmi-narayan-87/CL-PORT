name: Deploy Master Checker Dashboard

on:
  push:
    branches: [main]
    paths:
      - "master-checker/**"
      - ".github/workflows/deploy-master-checker.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Master Checker site
        uses: actions/upload-pages-artifact@v3
        with:
          path: master-checker

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
